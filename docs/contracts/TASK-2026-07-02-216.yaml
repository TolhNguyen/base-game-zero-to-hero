task_id: TASK-2026-07-02-216
objective: >
  Track Godot UID metadata generated for existing Card War test scripts so
  tools/check leaves the workspace clean.
root_cause: >
  Earlier Card War task contracts allowed Godot-generated UID sidecars for
  their new test scripts, but the generated files for orders, supply/morale,
  and camp/convoy tests were not committed. Later full checks recreated those
  sidecars as untracked files.
context: >
  Follow-up task required by docs/contracts/README.md: committed task
  contracts are immutable, so missing allowed outputs are recorded and
  committed with a new follow-up contract rather than editing old records.
inputs:
  - docs/contracts/TASK-2026-07-02-204.yaml allowed game/tests/card_war/test_orders.gd.uid
  - docs/contracts/TASK-2026-07-02-206.yaml allowed game/tests/card_war/test_supply_morale.gd.uid
  - docs/contracts/TASK-2026-07-02-208.yaml allowed game/tests/card_war/test_camp_convoy.gd.uid
  - Untracked UID files generated by Godot during tools/check runs
expected_outputs:
  - docs/contracts/TASK-2026-07-02-216.yaml records this cleanup follow-up
  - game/tests/card_war/test_orders.gd.uid is tracked
  - game/tests/card_war/test_supply_morale.gd.uid is tracked
  - game/tests/card_war/test_camp_convoy.gd.uid is tracked
allowed_paths:
  - docs/contracts/TASK-2026-07-02-216.yaml
  - game/tests/card_war/test_orders.gd.uid
  - game/tests/card_war/test_supply_morale.gd.uid
  - game/tests/card_war/test_camp_convoy.gd.uid
forbidden_actions:
  - editing files outside allowed_paths
  - editing existing docs/contracts execution records
  - editing game/core, tools/check*, tools/validate_*, docs/governance, existing ADRs/contracts, or .githooks
  - changing game behavior, tests, public APIs, or adding dependencies/plugins
expected_outputs_verification: >
  Run rtk git diff --check and expect no whitespace errors. Run
  rtk proxy C:\PROGRA~1\Git\bin\bash.exe tools/check.sh --fast and expect
  CHECK: PASS.
acceptance_criteria:
  - this follow-up does not edit TASK-2026-07-02-204.yaml, TASK-2026-07-02-206.yaml, TASK-2026-07-02-208.yaml, or any other committed contract
  - only the new follow-up contract and the three generated UID sidecars are staged
  - tools/check.sh --fast passes after the UID files are tracked
  - git status is clean after commit
required_evidence:
  - rtk git diff --check output
  - tools/check.sh --fast output summary
  - git status --short after commit
iteration_limit: 3
escalation_conditions:
  - acceptance criteria unreachable within iteration_limit
  - task requires editing an existing committed contract
  - task requires touching paths outside allowed_paths
report_format: >
  Reply with: status, metadata tracked, evidence, commit SHA, and any
  remaining review concerns.
