# Task Contract
task_id: TASK-2026-07-02-103
objective: >
  A dialogue module exists: data-driven DialogueDef resources played by a
  DialogueBox UI, announced on the EventBus.
context: >
  Phase 3 plan T4. Ring-2. Resolution via Registry stable IDs (P7).
inputs:
  - docs/memory/domains/registry.md
expected_outputs:
  - game/modules/dialogue/dialogue_def.gd (DialogueDef)
  - game/modules/dialogue/dialogue_box.gd + dialogue_box.tscn
  - game/tests/modules/test_dialogue.gd
allowed_paths:
  - game/modules/dialogue/**
  - game/tests/modules/**
forbidden_actions:
  - editing files outside allowed_paths
  - referencing other modules or demo (P8)
  - adding dependencies or plugins
expected_outputs_verification: >
  bash tools/check.sh -> CHECK: PASS including new tests.
acceptance_criteria:
  - start(&"dialogue.x") resolves via Registry; unknown id returns error
  - advance() steps lines; last advance hides box and publishes &"dialogue.finished"
  - &"dialogue.started" published on start; advance while inactive is a no-op
required_evidence:
  - tools/check output summary in commit body
iteration_limit: 3
escalation_conditions:
  - acceptance criteria unreachable within iteration_limit
  - task requires touching paths outside allowed_paths
  - task requires a Core-level change
report_format: >
  Commit message per change-rules; evidence in body.
